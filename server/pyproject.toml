[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kali-mcp-server"
version = "0.1.0"
description = "MCP server that exposes Kali Linux pentest/DAST tools over Streamable HTTP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Neeraj Narwal", email = "neerajnarwal2000@gmail.com" },
]
maintainers = [
  { name = "Neeraj Narwal", email = "neerajnarwal2000@gmail.com" },
]
keywords = [
  "mcp",
  "kali",
  "pentest",
  "dast",
  "security",
  "nmap",
  "streamable-http",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "mcp>=1.9.0",
  "python-dotenv>=1.0.0",
  "uvicorn>=0.30.0",
  "starlette>=0.37.0",
  "httpx2>=0.1.0",
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/captainnarwal/Kali-MCP"
Repository = "https://github.com/captainnarwal/Kali-MCP"
Issues = "https://github.com/captainnarwal/Kali-MCP/issues"
Documentation = "https://github.com/captainnarwal/Kali-MCP/blob/main/server/README.md"

[project.scripts]
kali-mcp-server = "kali_mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kali_mcp_server*"]
